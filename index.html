<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍅 Pomodoro Timer - Boost Your Productivity</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🍅</text></svg>">
</head>
<body>
    <div class="container">
        <h1>🍅 Pomodoro Timer</h1>
        <p class="subtitle">Stay focused, take breaks, be productive!</p>
        
        <div class="timer-display" id="timer">25:00</div>
        
        <div class="session-type" id="sessionType">Work Session</div>
        
        <div class="controls">
            <button id="startBtn" class="btn btn-primary">▶ START</button>
            <button id="pauseBtn" class="btn btn-primary" style="display:none;">⏸ PAUSE</button>
            <button id="resetBtn" class="btn btn-secondary">↻ RESET</button>
        </div>
        
        <div class="quick-actions">
            <button id="workBtn" class="btn btn-quick">💼 Work (25 min)</button>
            <button id="breakBtn" class="btn btn-quick">☕ Break (5 min)</button>
            <button id="longBreakBtn" class="btn btn-quick">😴 Long Break (15 min)</button>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="keyboard-shortcuts">
            <h3>⌨️ Keyboard Shortcuts</h3>
            <ul>
                <li><strong>Space:</strong> Start/Pause</li>
                <li><strong>R:</strong> Reset</li>
                <li><strong>W:</strong> Work Session</li>
                <li><strong>B:</strong> Break</li>
            </ul>
        </div>

        <audio id="notificationSound" preload="auto">
            <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj==" type="audio/wav">
        </audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
